version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulse-network

  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulse-network

  pulse-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: pulse-server
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pulse
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-32-char-encryption-key-here!!}
      SESSION_SECRET: ${SESSION_SECRET:-session-secret-change-in-production}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@pulse.app}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VAULT_URL: ${VAULT_URL:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SAML_CALLBACK_BASE_URL: ${SAML_CALLBACK_BASE_URL:-http://localhost:3000/api/v1/auth/saml}
      OIDC_CALLBACK_BASE_URL: ${OIDC_CALLBACK_BASE_URL:-http://localhost:3000/api/v1/auth/oidc}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pulse-network
    restart: unless-stopped

  pulse-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: pulse-client
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - pulse-server
    networks:
      - pulse-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  pulse-network:
    driver: bridge